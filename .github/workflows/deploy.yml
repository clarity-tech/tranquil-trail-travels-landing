name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out your repository
        uses: actions/checkout@v6
        with:
          # Full history: the sitemap derives each page's lastmod from the last
          # commit that touched its source. A shallow clone would give every
          # file the same date, so src/utils/git-lastmod.mjs omits lastmod
          # entirely rather than lie — this is what keeps the dates real.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Build your site
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: tranquiltrailtravels.com
          force_orphan: true
